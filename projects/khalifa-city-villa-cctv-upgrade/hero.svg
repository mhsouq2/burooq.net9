<path d="M22 -5 L60 -30 M22 -5 L65 5 M22 -5 L55 25" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/>
</g>
<!-- camera 2 -->
<g transform="translate(290,130) scale(-1,1)">
<rect x="0" y="0" width="8" height="40" fill="#0F3D63"/>
<rect x="-14" y="-14" width="34" height="18" rx="4" fill="#1C6DD0"/>
<circle cx="18" cy="-5" r="4" fill="#0F3D63"/>
<path d="M22 -5 L60 -30 M22 -5 L65 5 M22 -5 L55 25" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/>
</g>
<!-- phone with live view -->
<g transform="translate(340,90)">
<rect x="0" y="0" width="90" height="150" rx="14" fill="#0F3D63"/>
<rect x="8" y="14" width="74" height="110" rx="4" fill="#fff"/>
<rect x="14" y="20" width="62" height="45" rx="3" fill="#1C6DD0" opacity=".7"/>
<circle cx="45" cy="42" r="8" fill="#fff" opacity=".6"/>
<rect x="14" y="72" width="62" height="8" rx="2" fill="#CBD3DC"/>
<rect x="14" y="86" width="62" height="8" rx="2" fill="#CBD3DC"/>
<rect x="14" y="100" width="40" height="8" rx="2" fill="#5CC490"/>
<circle cx="45" cy="137" r="6" fill="#fff" opacity=".5"/>
</g>
<text x="40" y="300" font-family="Inter, sans-serif" font-size="15" fill="#0F3D63" font-weight="600">Khalifa City Villa &#8212; 8-Camera 4K Upgrade</text>
</svg>
