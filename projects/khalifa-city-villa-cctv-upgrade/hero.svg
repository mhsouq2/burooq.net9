<svg width="480" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
<rect width="480" height="320" fill="#E4EEFB" rx="16"/>
<!-- villa roof -->
<path d="M60 170 L170 100 L280 170 Z" fill="#0F3D63"/>
<rect x="80" y="170" width="170" height="90" fill="#fff" stroke="#CBD3DC" stroke-width="2"/>
<rect x="100" y="195" width="35" height="35" fill="#1C6DD0" opacity=".5"/>
<rect x="195" y="195" width="35" height="35" fill="#1C6DD0" opacity=".5"/>
<rect x="150" y="220" width="30" height="40" fill="#0F3D63"/>
<!-- perimeter wall -->
<line x1="40" y1="260" x2="290" y2="260" stroke="#CBD3DC" stroke-width="6"/>
<!-- camera 1 -->
<g transform="translate(60,130)">
<rect x="0" y="0" width="8" height="40" fill="#0F3D63"/>
<rect x="-14" y="-14" width="34" height="18" rx="4" fill="#1C6DD0"/>
