<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260">
<rect width="480" height="260" fill="#f4f6f8" rx="8"/>
<rect x="0" y="0" width="480" height="30" fill="#0F3D63" rx="8"/>
<text x="16" y="20" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Network Settings — Indoor Station</text>
<circle cx="40" cy="55" r="7" fill="#1C6DD0"/>
<text x="60" y="59" font-family="Arial,sans-serif" font-size="11" fill="#222">Obtain Automatically (DHCP)</text>
<text x="380" y="59" font-family="Arial,sans-serif" font-size="9" fill="#2a9d5c">● Enabled (default)</text>
<circle cx="40" cy="90" r="7" fill="none" stroke="#8FA0AE" stroke-width="2"/>
<text x="60" y="94" font-family="Arial,sans-serif" font-size="11" fill="#222">Static IP</text>
<text x="40" y="120" font-family="Arial,sans-serif" font-size="10" fill="#555">IP Address</text>
<rect x="150" y="108" width="150" height="18" rx="3" fill="#fff" stroke="#CBD3DC"/>
<text x="158" y="121" font-family="monospace" font-size="10" fill="#0F3D63">192.168.1.13</text>
<text x="40" y="147" font-family="Arial,sans-serif" font-size="10" fill="#555">Subnet Mask</text>
<rect x="150" y="135" width="150" height="18" rx="3" fill="#fff" stroke="#CBD3DC"/>
<text x="158" y="148" font-family="monospace" font-size="10" fill="#0F3D63">255.255.255.0</text>
<text x="40" y="174" font-family="Arial,sans-serif" font-size="10" fill="#555">Default Gateway</text>
<rect x="150" y="162" width="150" height="18" rx="3" fill="#fff" stroke="#CBD3DC"/>
<text x="158" y="175" font-family="monospace" font-size="10" fill="#0F3D63">192.168.1.1</text>
<rect x="40" y="200" width="10" height="10" fill="#E8A33D" opacity=".85"/>
<text x="58" y="209" font-family="Arial,sans-serif" font-size="9" fill="#8a6a1a">Must match the door station's IP segment</text>
<rect x="380" y="225" width="70" height="22" rx="4" fill="#1C6DD0"/>
<text x="415" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff">Apply</text>
</svg>
